<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#C8D0D8"/>
      <stop offset="50%" stop-color="#F2F6FA"/>
      <stop offset="75%" stop-color="#8A949E"/>
      <stop offset="100%" stop-color="#D8E0E8"/>
    </linearGradient>
    <linearGradient id="innerSteel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9BA4AE"/>
      <stop offset="45%" stop-color="#EEF3F7"/>
      <stop offset="60%" stop-color="#B8C2CC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbit Ring (Behind Badge) -->
  <g transform="rotate(-16 400 250)">
    <ellipse cx="400" cy="250" rx="330" ry="95" fill="none" stroke="url(#chromeGrad)" stroke-width="26" opacity="0.9"/>
    <ellipse cx="400" cy="250" rx="330" ry="95" fill="none" stroke="#10141A" stroke-width="8" opacity="0.5"/>
  </g>

  <!-- NASA-style Hexagonal Mission Patch -->
  <polygon points="400,75 635,145 660,250 635,355 400,425 165,355 140,250 165,145"
           fill="#11151C" stroke="url(#chromeGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#softGlow)"/>
  <polygon points="400,95 615,158 638,250 615,342 400,405 185,342 162,250 185,158"
           fill="url(#innerSteel)" stroke="#181D24" stroke-width="6" stroke-linejoin="round"/>

  <!-- Embossed Typography -->
  <text x="400" y="235" text-anchor="middle" font-family="'Eurostile', 'BankGothic', 'Orbitron', 'Arial Black', sans-serif"
        font-size="68" font-weight="900" letter-spacing="4" fill="#11151B">MISSION:</text>
  <text x="400" y="308" text-anchor="middle" font-family="'Eurostile', 'BankGothic', 'Orbitron', 'Arial Black', sans-serif"
        font-size="68" font-weight="900" letter-spacing="5" fill="#11151B">PYTHON</text>

  <!-- 4-Point Sparkle Stars -->
  <path d="M235,85 L240,103 L258,108 L240,113 L235,131 L230,113 L212,108 L230,103 Z" fill="#F0F5FA"/>
  <path d="M555,78 L558,90 L570,93 L558,96 L555,108 L552,96 L540,93 L552,90 Z" fill="#F0F5FA"/>
  <path d="M575,382 L580,400 L598,405 L580,410 L575,428 L570,410 L552,405 L570,400 Z" fill="#F0F5FA"/>
  <path d="M125,205 L128,215 L138,218 L128,221 L125,231 L122,221 L112,218 L122,215 Z" fill="#F0F5FA"/>
  <path d="M685,310 L688,320 L698,323 L688,326 L685,336 L682,326 L672,323 L682,320 Z" fill="#F0F5FA"/>
</svg>